<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Movement Church | Subscribers</title><meta name="robots" content="noindex,nofollow"><style>:root{--bg:#04111f;--panel:#0b1d2d;--blue:#2468f2;--muted:#9eb0c3;--line:#ffffff1a;--danger:#9b2c2c}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#061522;color:#fff}.wrap{width:min(1100px,92%);margin:auto}header{padding:18px;background:var(--bg);border-bottom:1px solid var(--line)}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font-weight:950;letter-spacing:3px}.sub{font-size:11px;color:#71adff;letter-spacing:2px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;border:0;border-radius:9px;padding:0 15px;background:var(--blue);color:#fff;font-weight:800;text-decoration:none;cursor:pointer}.secondary{background:#fff;color:#071421}.danger{background:var(--danger)}main{padding:28px 0 70px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}input{width:100%;padding:11px;border-radius:8px;border:1px solid #ffffff26;background:#071827;color:#fff}.status{display:none;margin-top:12px;padding:10px;border-radius:8px;background:#0f2e4b}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.metric{background:#071827;border:1px solid var(--line);border-radius:12px;padding:16px}.metric strong{display:block;font-size:26px}.metric span{color:var(--muted);font-size:12px}.table-wrap{overflow:auto}.row{display:grid;grid-template-columns:1.2fr 1.6fr .5fr .6fr .8fr;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);min-width:780px}.head{font-size:12px;color:#71adff;text-transform:uppercase;font-weight:900}.small{color:var(--muted);font-size:12px}@media(max-width:700px){.grid,.summary{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><header><div class="wrap top"><div><div class="brand">MOVEMENT CHURCH</div><div class="sub">SUBSCRIBERS</div></div><div><a class="btn secondary" href="/movement-church-website/admin.html">Administration</a> <a class="btn secondary" href="/movement-church-website/">Website</a> <button id="logout" class="btn danger" style="display:none">Sign out</button></div></div></header><main class="wrap"><section id="login" class="panel"><h2>Administrative access</h2><div class="grid"><div><label>Email</label><input id="email" value="frankcontact89@gmail.com" readonly></div><div><label>Password</label><input id="password" type="password"></div></div><button id="signIn" class="btn" style="margin-top:14px">Sign in</button><div id="authStatus" class="status"></div></section><section id="app" style="display:none"><div class="summary"><div class="metric"><strong id="total">0</strong><span>Total subscribers</span></div><div class="metric"><strong id="en">0</strong><span>English</span></div><div class="metric"><strong id="es">0</strong><span>Español</span></div><div class="metric"><strong id="pt">0</strong><span>Português</span></div></div><section class="panel"><div class="top"><div><h2 style="margin:0">Subscriber list</h2><p class="small">Only authorized administrators can view this list.</p></div><button id="export" class="btn">Export CSV</button></div><div class="table-wrap"><div class="row head"><div>Name</div><div>Email</div><div>Lang</div><div>Status</div><div>Joined</div></div><div id="list"></div></div><div id="listStatus" class="status"></div></section></section></main><script>(function(){'use strict';const BASE='https://yecywtxbuhfukergbwfc.supabase.co',KEY='sb_publishable_jFIuvZYIs1b-6IjqCnDPDw_BDivhFKs',ADMIN='frankcontact89@gmail.com';let token=localStorage.getItem('movement_admin_token')||'',data=[];const e=id=>document.getElementById(id);function st(id,t,b){const x=e(id);x.textContent=t;x.style.display='block';x.style.background=b?'#522':'#0f2e4b'}async function call(path,method='GET',body){const h={apikey:KEY};if(token)h.Authorization='Bearer '+token;const o={method,headers:h};if(body){h['Content-Type']='application/json';o.body=JSON.stringify(body)}const r=await fetch(BASE+path,o),txt=await r.text();let d;try{d=txt?JSON.parse(txt):null}catch{d=txt}if(!r.ok)throw new Error(d?.msg||d?.message||d?.error_description||d?.error||('Error '+r.status));return d}function show(){e('login').style.display='none';e('app').style.display='block';e('logout').style.display='inline-flex'}function login(){e('login').style.display='block';e('app').style.display='none';e('logout').style.display='none'}async function signIn(){try{const d=await call('/auth/v1/token?grant_type=password','POST',{email:ADMIN,password:e('password').value});token=d.access_token;localStorage.setItem('movement_admin_token',token);show();await load()}catch(x){st('authStatus',x.message,1)}}async function load(){try{data=await call('/rest/v1/movement_subscribers?select=*&order=created_at.desc');e('total').textContent=data.length;e('en').textContent=data.filter(x=>x.preferred_language==='en').length;e('es').textContent=data.filter(x=>x.preferred_language==='es').length;e('pt').textContent=data.filter(x=>x.preferred_language==='pt').length;const list=e('list');list.innerHTML='';data.forEach(x=>{const r=document.createElement('div');r.className='row';const vals=[x.name||'',x.email||'',String(x.preferred_language||'').toUpperCase(),x.is_active?'Active':'Inactive',x.created_at?new Date(x.created_at).toLocaleDateString():''];vals.forEach(v=>{const d=document.createElement('div');d.textContent=v;r.appendChild(d)});list.appendChild(r)})}catch(x){st('listStatus',x.message,1)}}function csv(){const q=v=>'"'+String(v??'').replaceAll('"','""')+'"';const rows=[['Name','Email','Language','Active','Brevo synced','Created']].concat(data.map(x=>[x.name,x.email,x.preferred_language,x.is_active,x.brevo_synced,x.created_at]));const blob=new Blob([rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='movement-church-subscribers.csv';a.click();URL.revokeObjectURL(a.href)}async function init(){e('signIn').onclick=signIn;e('export').onclick=csv;e('logout').onclick=()=>{token='';localStorage.removeItem('movement_admin_token');login()};if(!token)return login();try{const u=await call('/auth/v1/user');if((u.email||'').toLowerCase()!==ADMIN)throw new Error('Unauthorized');show();await load()}catch{token='';localStorage.removeItem('movement_admin_token');login()}}document.readyState==='loading'?document.addEventListener('DOMContentLoaded',init):init()})();</script></body></html>
