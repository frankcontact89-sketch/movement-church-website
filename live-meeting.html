<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Movement Church LIVE</title>
<style>
:root{--bg:#04111f;--panel:#0b1d2d;--blue:#2468f2;--muted:#a7b8c9;--line:#ffffff1a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.top{position:sticky;top:0;z-index:20;background:#04111ff2;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.head{height:72px;display:flex;align-items:center;gap:12px;padding:0 16px}.head img{width:44px;height:44px;border-radius:9px}.head strong{letter-spacing:.08em}.back{margin-left:auto;color:#fff;border:1px solid var(--line);padding:9px 12px;border-radius:10px}.quick{display:flex;overflow:auto;background:#fff;color:#071827;border-bottom:1px solid #dce3ea}.quick a{min-width:94px;text-align:center;padding:12px 10px;font-weight:850;font-size:13px}.wrap{width:min(1100px,calc(100% - 24px));margin:18px auto 50px}.stage{background:#000;border:1px solid var(--line);border-radius:18px;overflow:hidden;min-height:58vh;box-shadow:0 24px 70px #0008}.stage iframe{width:100%;height:72vh;border:0;display:block}.msg{padding:28px;text-align:center;color:var(--muted)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:10px;background:var(--blue);font-weight:900}.btn.secondary{background:#fff;color:#071827}.hint{color:var(--muted);font-size:14px;margin:12px 2px}.bottom{display:none}@media(max-width:700px){.head strong{font-size:14px}.quick{display:none}.wrap{width:100%;margin:0}.stage{border-radius:0;border-left:0;border-right:0;min-height:calc(100vh - 142px)}.stage iframe{height:calc(100vh - 142px)}.actions{padding:0 12px 88px}.actions .btn{flex:1}.hint{padding:0 12px}.bottom{position:fixed;display:flex;left:0;right:0;bottom:0;z-index:30;background:#fff;color:#071827;border-top:1px solid #dce3ea;padding-bottom:env(safe-area-inset-bottom);overflow:auto}.bottom a{min-width:82px;flex:1;text-align:center;padding:11px 7px 9px;font-size:12px;font-weight:850}.bottom b{display:block;font-size:19px;line-height:1.1;margin-bottom:4px}}
</style>
</head><body>
<div class="top"><div class="head"><img src="Logo.jpg" alt="Movement Church"><strong>MOVEMENT CHURCH LIVE</strong><a class="back" href="./#live">Website</a></div></div>
<nav class="quick"><a href="./#live">● LIVE</a><a href="./#bible">▤ Bible</a><a href="./#sermons">▶ Sermons</a><a href="./#events">◷ Meetings</a><a href="./#give">♡ Give</a><a href="./#contact">Contact</a></nav>
<main class="wrap"><div id="stage" class="stage"><div class="msg">Connecting to Movement Church LIVE…</div></div><p class="hint">Stay on this page to keep the Movement Church website available while you participate in the meeting.</p><div id="actions" class="actions"></div></main>
<nav class="bottom"><a href="./#live"><b>●</b>LIVE</a><a href="./#bible"><b>▤</b>Bible</a><a href="./#sermons"><b>▶</b>Sermons</a><a href="./#events"><b>◷</b>Meetings</a><a href="./#give"><b>♡</b>Give</a></nav>
<script>
const SB='https://yecywtxbuhfukergbwfc.supabase.co';const KEY='sb_publishable_jFIuvZYIs1b-6IjqCnDPDw_BDivhFKs';
(async()=>{const stage=document.getElementById('stage'),actions=document.getElementById('actions');try{const r=await fetch(SB+'/rest/v1/movement_live_config?id=eq.1&select=*',{headers:{apikey:KEY},cache:'no-store'});const rows=await r.json(),c=rows&&rows[0];if(!c||!c.zoom_join_url)throw new Error('No live meeting');const u=String(c.zoom_join_url).trim();const frame=document.createElement('iframe');frame.title='Movement Church Zoom meeting';frame.allow='camera; microphone; display-capture; fullscreen; autoplay; clipboard-write';frame.referrerPolicy='strict-origin-when-cross-origin';frame.src=u;stage.innerHTML='';stage.appendChild(frame);actions.innerHTML='<a class="btn secondary" target="_blank" rel="noopener" href="'+u.replace(/"/g,'&quot;')+'">Open in Zoom</a><a class="btn" href="./#bible">Bible</a><a class="btn" href="./#give">Give</a>'}catch(e){stage.innerHTML='<div class="msg">The live meeting is not available right now.</div>'}})();
</script></body></html>
