<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Movement Church LIVE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
<script src="https://source.zoom.us/6.2.0/lib/vendor/react.min.js"></script>
<script src="https://source.zoom.us/6.2.0/lib/vendor/react-dom.min.js"></script>
<script src="https://source.zoom.us/6.2.0/lib/vendor/redux.min.js"></script>
<script src="https://source.zoom.us/6.2.0/lib/vendor/redux-thunk.min.js"></script>
<script src="https://source.zoom.us/6.2.0/lib/vendor/lodash.min.js"></script>
<script src="https://source.zoom.us/zoom-meeting-6.2.0.min.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button{font:inherit}#zmmtg-root{display:none}.permission{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#04111f;z-index:20000}.permission.hidden{display:none}.permission-card{width:min(430px,100%);background:#0b1d2c;border:1px solid #ffffff24;border-radius:22px;padding:24px;text-align:center;box-shadow:0 24px 70px #0008}.permission h1{margin:0 0 12px;font-size:27px}.permission p{margin:0 0 18px;color:#c7d5e2;line-height:1.45}.permission button{width:100%;min-height:56px;border:0;border-radius:13px;background:#2468f2;color:#fff;font-weight:900;font-size:17px}.permission button:disabled{opacity:.6}.permission .error{color:#ffb4b4;margin-top:14px;min-height:22px}.church-tab{display:none;position:fixed;right:0;top:48%;transform:translateY(-50%);z-index:12000;border:1px solid #ffffff40;background:#0b5bd3;color:#fff;border-radius:16px 0 0 16px;padding:13px 9px;font-weight:900;box-shadow:0 8px 30px #0008}.church-tab.show{display:block}.early-exit{position:fixed;top:max(10px,env(safe-area-inset-top));right:10px;z-index:13000;border:0;background:#b42318;color:#fff;border-radius:12px;padding:11px 15px;font-weight:900;box-shadow:0 8px 24px #0008}.menu-backdrop{display:none;position:fixed;inset:0;z-index:14000;background:#0009}.menu-backdrop.open{display:block}.menu-sheet{position:absolute;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));background:#fff;color:#071827;border-radius:22px;padding:16px;box-shadow:0 20px 70px #000c}.menu-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}.menu-head strong{flex:1}.menu-close{border:0;background:#eef3f8;border-radius:10px;min-width:42px;min-height:42px;font-weight:900}.menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.menu-grid button{min-height:64px;border:0;border-radius:14px;background:#eef3f8;color:#071827;font-weight:900}.menu-grid .danger{background:#fee9e7;color:#9d1c12}.content-panel{display:none;position:fixed;left:0;right:0;top:220px;bottom:0;z-index:15000;background:#fff;box-shadow:0 -8px 28px #0008}.content-panel.open{display:block}.content-head{height:58px;padding:0 12px;display:flex;align-items:center;gap:10px;background:#04111f;color:#fff}.content-head strong{flex:1}.return-live{border:0;background:#2468f2;color:#fff;border-radius:11px;padding:10px 13px;font-weight:900}.content-frame{width:100%;height:calc(100% - 58px);border:0;background:#fff}@media(max-height:700px){.content-panel{top:180px}}
</style>
</head>
<body>
<div id="permission" class="permission"><div class="permission-card"><h1 id="permissionTitle">Enable microphone</h1><p id="permissionText">Allow microphone access so Zoom audio can work correctly. You can stay muted when you enter.</p><button id="permissionButton" type="button">Allow microphone & join</button><div id="permissionError" class="error" role="status" aria-live="polite"></div></div></div>
<button id="churchTab" class="church-tab" type="button">CHURCH</button>
<button id="earlyExit" class="early-exit" type="button">EXIT</button>
<div id="menuBackdrop" class="menu-backdrop"><div class="menu-sheet"><div class="menu-head"><strong>Movement Church</strong><button id="menuClose" class="menu-close" type="button">✕</button></div><div class="menu-grid"><button data-section="bible">BIBLE</button><button data-section="give">GIVE</button><button data-section="home">HOME</button><button id="menuExit" class="danger" type="button">EXIT</button></div></div></div>
<div id="contentPanel" class="content-panel" aria-hidden="true"><div class="content-head"><strong id="contentTitle">Movement Church</strong><button id="returnLive" class="return-live" type="button">Return to LIVE</button></div><iframe id="contentFrame" class="content-frame" title="Movement Church content" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe></div>
<script>
(function(){
'use strict';
const params=new URLSearchParams(location.search);
if(window.top!==window.self&&!params.has('top')){params.set('top','1');window.top.location.replace('meeting-client.html?'+params.toString());return}
const PF_URL='https://xikmhnulxksadgvzajdk.supabase.co';
const PF_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ4aWttaG51bHhrc2FkanZhamRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4NTQxMjgsImV4cCI6MjA4MTQzMDEyOH0.ItlRdBJFk_sNkxS3ghggifNXaMc2sRFx-B8P4afFIjI';
const userName=(params.get('name')||'Guest').slice(0,120);
const lang=(params.get('lang')||'en').toLowerCase();
const zoomLang={en:'en-US',es:'es-ES',pt:'pt-PT'}[lang]||'en-US';
const copy={
 en:{title:'Enable microphone',text:'Allow microphone access so Zoom audio can work correctly. You can stay muted when you enter.',button:'Allow microphone & join',blocked:'Microphone access is blocked. In Safari, open Website Settings for movementchurchglobal.org and set Microphone to Allow, then try again.',unavailable:'This browser could not request microphone access.',church:'CHURCH',bible:'BIBLE',give:'GIVE',home:'HOME',exit:'EXIT',returnLive:'Return to LIVE'},
 es:{title:'Activar micrófono',text:'Permite el acceso al micrófono para que el audio de Zoom funcione correctamente. Puedes entrar silenciado.',button:'Permitir micrófono y entrar',blocked:'El micrófono está bloqueado. En Safari abre Configuración del sitio web para movementchurchglobal.org y selecciona Permitir en Micrófono, luego intenta otra vez.',unavailable:'Este navegador no pudo solicitar acceso al micrófono.',church:'IGLESIA',bible:'BIBLIA',give:'DAR',home:'INICIO',exit:'SALIR',returnLive:'Volver a EN VIVO'},
 pt:{title:'Ativar microfone',text:'Permita o acesso ao microfone para que o áudio do Zoom funcione corretamente. Você pode entrar no mudo.',button:'Permitir microfone e entrar',blocked:'O microfone está bloqueado. No Safari, abra Ajustes do Site para movementchurchglobal.org e defina Microfone como Permitir, depois tente novamente.',unavailable:'Este navegador não conseguiu solicitar acesso ao microfone.',church:'IGREJA',bible:'BÍBLIA',give:'CONTRIBUIR',home:'INÍCIO',exit:'SAIR',returnLive:'Voltar para AO VIVO'}
};
const words=copy[lang]||copy.en;
const permission=document.getElementById('permission'),permissionButton=document.getElementById('permissionButton'),permissionError=document.getElementById('permissionError'),churchTab=document.getElementById('churchTab'),earlyExit=document.getElementById('earlyExit'),menu=document.getElementById('menuBackdrop'),contentPanel=document.getElementById('contentPanel'),contentFrame=document.getElementById('contentFrame'),contentTitle=document.getElementById('contentTitle');
document.getElementById('permissionTitle').textContent=words.title;document.getElementById('permissionText').textContent=words.text;permissionButton.textContent=words.button;churchTab.textContent=words.church;earlyExit.textContent=words.exit;document.getElementById('menuExit').textContent=words.exit;document.getElementById('returnLive').textContent=words.returnLive;document.querySelector('[data-section="bible"]').textContent=words.bible;document.querySelector('[data-section="give"]').textContent=words.give;document.querySelector('[data-section="home"]').textContent=words.home;
let started=false,joined=false,permissionStream=null,selfHideTimer=null;const hiddenSelfNodes=[];
function notify(type,extra={}){if(window.parent!==window){try{parent.postMessage({source:'movement-live',type,...extra},location.origin)}catch(_){}}}
async function getSignature(){const sb=window.supabase.createClient(PF_URL,PF_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});const result=await sb.functions.invoke('zoom-signature',{body:{}});if(result.error)throw result.error;if(!result.data?.success)throw new Error(result.data?.error||'LIVE not configured');return result.data}
async function requestMicrophone(){if(!navigator.mediaDevices?.getUserMedia){permissionError.textContent=words.unavailable;return false}try{permissionStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});return true}catch(error){console.error(error);permissionError.textContent=words.blocked;return false}}
function releasePermissionStream(){if(permissionStream){permissionStream.getTracks().forEach(t=>t.stop());permissionStream=null}}
function openMenu(){menu.classList.add('open')}function closeMenu(){menu.classList.remove('open')}
function cleanFrame(){try{const doc=contentFrame.contentDocument;if(!doc)return;const st=doc.createElement('style');st.textContent='header,.desktop,#mobile,.mobile,nav,.bottom,.mobile-bottom,.bottom-nav,[class*="bottom-nav"],[class*="bottomNav"]{display:none!important}html,body{padding-bottom:0!important;margin-bottom:0!important}';doc.head.appendChild(st)}catch(_){}}
function hideFloatingSelfView(){
 try{
  const labels=[...document.querySelectorAll('body *')].filter(el=>el.children.length===0&&el.textContent&&el.textContent.trim()===userName);
  for(const label of labels){
   let node=label;
   for(let i=0;i<7&&node;i++,node=node.parentElement){
    const r=node.getBoundingClientRect();
    const cs=getComputedStyle(node);
    if(r.width>140&&r.width<innerWidth*.78&&r.height>90&&r.height<innerHeight*.58&&(cs.position==='fixed'||cs.position==='absolute'||r.top<260)){
     if(!node.dataset.mcSelfHidden){node.dataset.mcSelfHidden='1';node.dataset.mcPrevDisplay=node.style.display||'';node.style.setProperty('display','none','important');hiddenSelfNodes.push(node)}
     break;
    }
   }
  }
 }catch(_){}
}
function startSelfHide(){stopSelfHide(false);hideFloatingSelfView();selfHideTimer=setInterval(hideFloatingSelfView,450)}
function stopSelfHide(restore=true){if(selfHideTimer){clearInterval(selfHideTimer);selfHideTimer=null}if(restore){while(hiddenSelfNodes.length){const node=hiddenSelfNodes.pop();if(node&&node.isConnected){node.style.removeProperty('display');if(node.dataset.mcPrevDisplay)node.style.display=node.dataset.mcPrevDisplay;delete node.dataset.mcSelfHidden;delete node.dataset.mcPrevDisplay}}}}
function openContent(section){closeMenu();contentTitle.textContent=section==='bible'?words.bible:section==='give'?words.give:'Movement Church';contentFrame.src=section==='home'?'./':'./#'+section;contentFrame.onload=cleanFrame;contentPanel.classList.add('open');contentPanel.setAttribute('aria-hidden','false');churchTab.classList.remove('show');startSelfHide()}
function returnLive(){stopSelfHide(true);contentPanel.classList.remove('open');contentPanel.setAttribute('aria-hidden','true');contentFrame.src='about:blank';if(joined)churchTab.classList.add('show')}
async function start(){try{if(!window.ZoomMtg)throw new Error('Zoom SDK unavailable');try{const i18n=ZoomMtg.i18n;if(i18n?.load){const r=i18n.load(zoomLang);if(r?.then)await r}}catch(_){}const data=await getSignature();ZoomMtg.setZoomJSLib('https://source.zoom.us/6.2.0/lib','/av');ZoomMtg.preLoadWasm();ZoomMtg.prepareWebSDK();document.getElementById('zmmtg-root').style.display='block';started=true;notify('starting');ZoomMtg.init({leaveUrl:'live-meeting.html',patchJsMedia:true,disableCORP:!window.crossOriginIsolated,success:()=>ZoomMtg.join({signature:data.signature,sdkKey:data.sdkKey,meetingNumber:data.meetingNumber,passWord:data.passcode||'',userName,userEmail:'',success:()=>{joined=true;setTimeout(releasePermissionStream,1500);earlyExit.style.display='none';churchTab.classList.add('show');notify('joined')},error:error=>{console.error(error);releasePermissionStream();permissionError.textContent=error?.reason||error?.message||'Unable to join';permission.classList.remove('hidden')}}),error:error=>{console.error(error);releasePermissionStream();permissionError.textContent=error?.reason||error?.message||'Unable to open Zoom';permission.classList.remove('hidden')}})}catch(error){console.error(error);releasePermissionStream();permissionError.textContent=error?.message||'Unable to start Zoom';permission.classList.remove('hidden')}}
async function authorizeAndStart(){permissionButton.disabled=true;permissionError.textContent='';const allowed=await requestMicrophone();if(!allowed){permissionButton.disabled=false;return}permission.classList.add('hidden');await start();permissionButton.disabled=false}
function finishLeave(){stopSelfHide(true);releasePermissionStream();location.replace('live-meeting.html')}
function leave(){try{if(started&&window.ZoomMtg?.leaveMeeting){ZoomMtg.leaveMeeting({confirm:false,success:finishLeave,error:finishLeave});setTimeout(finishLeave,1300)}else finishLeave()}catch(_){finishLeave()}}
permissionButton.addEventListener('click',authorizeAndStart);churchTab.addEventListener('click',openMenu);document.getElementById('menuClose').addEventListener('click',closeMenu);menu.addEventListener('click',e=>{if(e.target===menu)closeMenu()});document.querySelectorAll('[data-section]').forEach(b=>b.addEventListener('click',()=>openContent(b.dataset.section)));document.getElementById('returnLive').addEventListener('click',returnLive);earlyExit.addEventListener('click',leave);document.getElementById('menuExit').addEventListener('click',leave);window.addEventListener('beforeunload',()=>{stopSelfHide(false);releasePermissionStream()});
})();
</script>
</body>
</html>
