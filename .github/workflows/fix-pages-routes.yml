name: Fix GitHub Pages routes
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-pages-routes.yml'
permissions:
  contents: write
jobs:
  fix-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair project-site absolute routes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
            '/admin.html': '/movement-church-website/admin.html',
            '/subscribers.html': '/movement-church-website/subscribers.html',
            '/movement-admin.js': '/movement-church-website/movement-admin.js',
          }
          for name in ['index.html','admin.html','subscribers.html']:
              p=Path(name)
              if not p.exists(): continue
              s=p.read_text()
              for old,new in replacements.items():
                  s=s.replace(old,new)
              # Only navigation links that point to the GitHub Pages account root.
              s=s.replace('href="/"','href="/movement-church-website/"')
              p.write_text(s)
          PY
      - name: Commit repaired routes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html admin.html subscribers.html
          git commit -m 'Fix Movement Church GitHub Pages admin routes'
          git push
